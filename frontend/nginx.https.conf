server {
    listen 80;
    server_name _;
    # HTTPS is enabled — send plain-HTTP visitors straight to the TLS port.
    # 8443 is the host-published port from docker-compose.https.yaml, not
    # nginx's own internal 443 — must match if that mapping ever changes.
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Reverse-proxy /api to the backend container. Keeps the browser's calls
    # same-origin (no CORS), and RUM's allowedTracingUrls (/\/api\//) still
    # matches this path, so trace-propagation headers flow through untouched —
    # proxy_pass forwards client request headers by default.
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:3001/health;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
